# v1.0.0 — the POS on one EC2: Angular, Django's static and media files, the API.
#
# Plain HTTP on purpose. After enabling it, `sudo certbot --nginx -d <domain>`
# adds the HTTPS server, the certificate and the http→https redirect, and
# renews the certificate by itself. Replace pos.example.com first
# (deploy/README.md).
server {
    listen 80;
    listen [::]:80;
    server_name pos.example.com;

    client_max_body_size 10m;   # product images, the stock import file

    # Sent on every proxied request. X-Forwarded-Proto is always nginx's own
    # value, never one a client sent — Django trusts it for "was this HTTPS"
    # (SECURE_PROXY_SSL_HEADER).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The API docs stay off the live server (owner's choice, 2026-10-09).
    location ^~ /api/docs/   { return 404; }
    location ^~ /api/schema/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # collectstatic: the Django admin's files
    location /static/ {
        alias /srv/pos/static/;
        expires 7d;
    }

    # Uploads: company logo, payment QR, category, brand and product images
    location /media/ {
        alias /srv/pos/media/;
    }

    # The Angular build. Any other path is a screen of the app, so it gets
    # index.html and Angular's router takes it from there.
    root /var/www/pos;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
